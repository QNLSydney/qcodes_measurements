[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "qcodes-measurements"
version = "0.1.0"
description = "QNL qcodes measurement procedures"
authors = [
    {name = "Sebastian Pauka", email = "spauka@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "matplotlib>=3.10",
    "pyqtgraph>=0.14",
    "qcodes>=0.61.1",
    "numpy>2.2",
    "scipy>1.17",
    "tabulate>=0.9",
    "tqdm>4.67",
    "requests>=2.33.0",
    "pyside6>=6.12",
    "pyserial>=3.5",
    "pyzmq>=27.2.0",
    "python-dateutil>=3.0.0",
    "packaging>=26.3",
]

[project.urls]
"Internal drivers" = "https://github.com/emergencequantum/drivers.git"

[project.scripts]
yoko-mirror = "qcodes_measurements.scripts.yoko_mirror:main"

[dependency-groups]
dev = [
    "ty>=0.0.108",
    "pylint>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
respect-gitignore = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally re-export the public plotting API.
"**/__init__.py" = ["F401", "F403"]
"qcodes_measurements/plot/rpyplot.py" = ["F401"]
# StrEnum would change the existing auto-generated values and string representation.
"qcodes_measurements/device/states.py" = ["UP042"]

[tool.ty.src]
include = ["qcodes_measurements", "tests"]
respect-ignore-files = false

[tool.pylint.main]
extension-pkg-allow-list = ["PySide6"]
persistent = false

[tool.pylint.messages_control]
# Preserve the public Qt/pyqtgraph naming conventions and callback signatures.
# Ruff handles style; Pylint checks errors and non-style warnings.
disable = ["C", "R", "abstract-method", "protected-access", "unused-argument"]

[tool.pylint.typecheck]
# Qt signals and SciPy's extension exports are resolved by ty.
generated-members = ["connect", "disconnect"]
ignored-modules = ["scipy.spatial"]
